<!doctype html>
<html>
  <body style="margin: 0; padding: 0; background-color: #ffffff;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #ffffff;">
      <tr>
        <td align="center" style="padding: 40px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 460px; text-align: left; font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #171717;">
            <!-- Wordmark (swap for hosted logo image once a domain exists) -->
            <tr>
              <td style="padding-bottom: 32px; font-family: 'SF Mono', 'Roboto Mono', Menlo, monospace; font-size: 20px; font-weight: 700; color: #0a0a0a;">
                Workset.
              </td>
            </tr>
            <tr>
              <td style="padding-bottom: 24px; font-size: 20px; font-weight: 700; color: #0a0a0a;">
                Log in to Workset
              </td>
            </tr>
            <tr>
              <td style="padding-bottom: 24px; font-size: 14px; line-height: 24px;">
                A log in code was requested for <strong>{{ .Email }}</strong>.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom: 24px;">
                <div style="background-color: #fafafa; border-radius: 8px; padding: 24px; text-align: center; font-family: 'SF Mono', 'Roboto Mono', Menlo, monospace; font-size: 32px; font-weight: 700; letter-spacing: 10px; color: #0a0a0a;">
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding-bottom: 32px; font-size: 14px; line-height: 24px;">
                This code expires in 5 minutes.
              </td>
            </tr>
            <tr>
              <td style="border-top: 1px solid #ebebeb; padding-top: 24px; font-size: 12px; line-height: 20px; color: #666666;">
                If you didn't request this, ignore this email. Workset will never
                ask for this code by phone, chat, or email.
              </td>
            </tr>
            <tr>
              <td style="padding-top: 16px; font-size: 12px; line-height: 20px; color: #666666;">
                Copyright © 2026 Workset. All rights reserved.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
